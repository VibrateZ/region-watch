[package]
name = "region-watch"
version = "0.1.0"
description = "Low overhead screen region change monitor"
authors = ["Codex"]
edition = "2021"

[lib]
name = "region_watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"`r`nbase64 = "0.22"
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true


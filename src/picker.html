<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#222;cursor:crosshair}#screen{position:fixed;left:0;top:0;image-rendering:auto}#box{position:fixed;border:3px solid #20e060;background:rgba(32,224,96,.15);display:none;pointer-events:none;box-sizing:border-box}#tip{position:fixed;z-index:3;top:20px;left:50%;transform:translateX(-50%);padding:10px 16px;background:rgba(0,0,0,.78);color:white;border-radius:6px;font:15px system-ui}</style><img id=screen><div id=tip>拖动鼠标框选区域，松开后自动确认；Esc 取消</div><div id=box></div><script>const{invoke}=window.__TAURI__.core;const screen=document.getElementById('screen'),box=document.getElementById('box');let sx=0,sy=0,drag=false;async function load(){const s=await invoke('screen_snapshot');const bin=atob(s.data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const ctx=c.getContext('2d'),img=ctx.createImageData(s.width,s.height);for(let y=0;y<s.height;y++)for(let x=0;x<s.width;x++){const si=y*s.stride+x*3,di=(y*s.width+x)*4;img.data[di]=bytes[si+2];img.data[di+1]=bytes[si+1];img.data[di+2]=bytes[si];img.data[di+3]=255}ctx.putImageData(img,0,0);screen.src=c.toDataURL('image/png');screen.width=s.width;screen.height=s.height}load();addEventListener('mousedown',e=>{if(e.button!==0)return;sx=e.clientX;sy=e.clientY;drag=true;box.style.display='block'});addEventListener('mousemove',e=>{if(!drag)return;const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY),w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px'});addEventListener('mouseup',async e=>{if(!drag)return;drag=false;const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY),w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);if(w>=4&&h>=4){await window.__TAURI__.event.emit('region-selected',{x,y,w,h});await window.__TAURI__.window.getCurrentWindow().close()}});addEventListener('keydown',async e=>{if(e.key==='Escape')await window.__TAURI__.window.getCurrentWindow().close()});</script></html>

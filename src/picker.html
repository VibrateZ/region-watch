<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:transparent;cursor:crosshair}#box{position:fixed;border:3px solid #20e060;background:rgba(32,224,96,.15);display:none;pointer-events:none}#tip{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 16px;background:rgba(0,0,0,.75);color:white;border-radius:6px;font:15px system-ui}</style><div id=tip>拖动鼠标框选区域，松开后自动确认；Esc 取消</div><div id=box></div><script>const box=document.getElementById('box');let sx=0,sy=0,drag=false;addEventListener('mousedown',e=>{if(e.button!==0)return;sx=e.screenX;sy=e.screenY;drag=true;box.style.display='block'});addEventListener('mousemove',e=>{if(!drag)return;const x=Math.min(sx,e.screenX),y=Math.min(sy,e.screenY),w=Math.abs(e.screenX-sx),h=Math.abs(e.screenY-sy);box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px'});addEventListener('mouseup',async e=>{if(!drag)return;drag=false;const x=Math.min(sx,e.screenX),y=Math.min(sy,e.screenY),w=Math.abs(e.screenX-sx),h=Math.abs(e.screenY-sy);if(w>=4&&h>=4){await window.__TAURI__.event.emit('region-selected',{x,y,w,h});await window.__TAURI__.window.getCurrentWindow().close()}});addEventListener('keydown',async e=>{if(e.key==='Escape')await window.__TAURI__.window.getCurrentWindow().close()});</script></html>
